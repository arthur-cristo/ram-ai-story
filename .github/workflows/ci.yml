name: CI/CD

on:
  workflow_dispatch:
  push:

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn chakra:typegen
      - run: yarn build
